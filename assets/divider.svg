<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="900" height="2" fill="url(#g)" opacity="0.35"/>
  <rect x="-200" y="1" width="200" height="4" rx="2" fill="url(#g)">
    <animate attributeName="x" from="-200" to="900" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
